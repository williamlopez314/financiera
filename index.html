<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruta 2027: Carrera de Obstáculos Financieros</title>
    <style>
        :root { --blue: #2c3e50; --green: #27ae60; --red: #e74c3c; --yellow: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; overflow-x: hidden; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--blue); color: white; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        #track-area { flex-grow: 1; position: relative; background: #fff; overflow-x: auto; white-space: nowrap; padding: 50px 0; }
        .lane { height: 80px; border-bottom: 2px dashed #ccc; position: relative; width: 5000px; display: flex; align-items: center; }
        .lane-label { position: sticky; left: 10px; background: rgba(255,255,255,0.8); padding: 5px; z-index: 10; font-weight: bold; border-radius: 5px; }
        
        .runner { width: 50px; height: 50px; position: absolute; left: 0; transition: left 0.5s linear; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 5; }
        
        .hurdle { position: absolute; width: 40px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 20px; border-left: 3px solid; }
        .hurdle.credit { border-color: var(--red); color: var(--red); }
        .hurdle.save { border-color: var(--green); color: var(--green); }
        .hurdle.inst { border-color: var(--blue); color: var(--blue); }
        .hurdle-label { font-size: 10px; transform: rotate(-45deg); margin-bottom: 60px; }

        #ui-panel { background: #eee; padding: 15px; display: flex; justify-content: space-around; border-top: 2px solid #ddd; }
        .stat-card { background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; min-width: 150px; }
        
        #decision-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.5); z-index: 100; max-width: 400px; text-align: center; }
        .btn { padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: bold; }
        .btn-primary { background: var(--blue); }
        .btn-success { background: var(--green); }
    </style>
</head>
<body>

<header>
    <h1>🏁 RUTA 2027: El Gran Obstáculo Financiero (5 Años)</h1>
    <p>Objetivo: Llegar al mes 60 con capacidad para el "Pie" de tu vivienda</p>
</header>

<div id="track-area">
    <!-- Generado por JS -->
</div>

<div id="ui-panel">
    <div class="stat-card"><strong>Mes:</strong> <span id="current-month">1</span>/60</div>
    <div class="stat-card"><strong>Saldo:</strong> $<span id="balance">0</span></div>
    <div class="stat-card"><strong>Carga Financiera:</strong> <span id="debt-load">0</span>%</div>
    <div class="stat-card"><strong>AFP Acumulado:</strong> $<span id="afp-total">0</span></div>
</div>

<div id="decision-modal">
    <h3 id="modal-title">⚠️ ¡IMPREVISTO!</h3>
    <p id="modal-text">Tu notebook ha muerto. Necesitas $850.000 para Ingeniería.</p>
    <div id="modal-options"></div>
</div>

<script>
    const CONFIG = {
        totalMonths: 60,
        baseIncome: 500000,
        fixedExpenses: 350000, // Arriendo y comida
        hurdles: [
            { month: 5, type: 'credit', title: '💻 Notebook quemado', text: '¿Cómo pagas los $850.000?', options: [
                { text: 'Tarjeta (12 cuotas, CAE 35%)', impact: -85000, debt: 12 },
                { text: 'Ahorro (Usar fondo emergencia)', impact: -400000, debt: 0 }
            ]},
            { month: 12, type: 'inst', title: '🏦 Trivia CMF', text: '¿Quién regula las tarjetas de retail?', options: [
                { text: 'CMF (Correcto +$50k)', impact: 50000 },
                { text: 'Banco Central (Incorrecto)', impact: 0 }
            ]},
            { month: 24, type: 'save', title: '📈 Bono Desempeño', text: 'Recibes $200.000 extra.', options: [
                { text: 'Ahorro en Cuenta 2 (AFP)', impact: 200000, afp: true },
                { text: 'Viaje con amigos', impact: 0 }
            ]},
            { month: 36, type: 'credit', title: '🏥 Urgencia Médica', text: 'Cuenta de $1.200.000.', options: [
                { text: 'Préstamo Fonasa (5% sueldo)', impact: -25000, debt: 24 },
                { text: 'Avance en Efectivo', impact: -120000, debt: 12 }
            ]},
            { month: 55, type: 'inst', title: '🏠 El Sueño del Pie', text: '¿Tienes el 20% para el departamento de UF 2.900?', options: [
                { text: 'Evaluar mi ahorro', impact: 0 }
            ]}
        ]
    };

    let gameState = { month: 1, balance: 200000, afp: 0, currentDebt: 0, isPaused: false };
    const trackArea = document.getElementById('track-area');

    function initGame() {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.innerHTML = `<div class="lane-label">TU RUTA</div><div id="p1" class="runner">🏃</div>`;
        
        CONFIG.hurdles.forEach(h => {
            const hDiv = document.createElement('div');
            hDiv.className = `hurdle ${h.type}`;
            hDiv.style.left = `${h.month * 80}px`;
            hDiv.innerHTML = `<span class="hurdle-label">${h.title}</span><span>${h.type === 'credit' ? '💳' : h.type === 'save' ? '💰' : '🏦'}</span>`;
            lane.appendChild(hDiv);
        });
        
        trackArea.appendChild(lane);
        gameLoop();
    }

    function gameLoop() {
        if (gameState.month > CONFIG.totalMonths || gameState.isPaused) return;

        // Lógica de mes automático (Equilibrio Financiero [1])
        let monthlySurplus = CONFIG.baseIncome - CONFIG.fixedExpenses - gameState.currentDebt;
        gameState.balance += monthlySurplus;
        gameState.afp += CONFIG.baseIncome * 0.10; // Pilar contributivo [12]

        // Actualizar UI
        document.getElementById('current-month').innerText = gameState.month;
        document.getElementById('balance').innerText = gameState.balance.toLocaleString();
        document.getElementById('afp-total').innerText = Math.floor(gameState.afp).toLocaleString();
        document.getElementById('debt-load').innerText = Math.round((gameState.currentDebt / (CONFIG.baseIncome - 350000)) * 100);
        
        document.getElementById('p1').style.left = `${gameState.month * 80}px`;

        // Check vallas
        const hurdle = CONFIG.hurdles.find(h => h.month === gameState.month);
        if (hurdle) {
            triggerDecision(hurdle);
        } else {
            gameState.month++;
            setTimeout(gameLoop, 600);
        }
    }

    function triggerDecision(hurdle) {
        gameState.isPaused = true;
        const modal = document.getElementById('decision-modal');
        modal.style.display = 'block';
        document.getElementById('modal-title').innerText = hurdle.title;
        document.getElementById('modal-text').innerText = hurdle.text;
        
        const optionsDiv = document.getElementById('modal-options');
        optionsDiv.innerHTML = '';
        hurdle.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.innerText = opt.text;
            btn.onclick = () => applyDecision(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function applyDecision(opt) {
        if (opt.debt) gameState.currentDebt += Math.abs(opt.impact);
        else gameState.balance += opt.impact;
        
        document.getElementById('decision-modal').style.display = 'none';
        gameState.isPaused = false;
        gameState.month++;
        gameLoop();
    }

    initGame();
</script>
</body>
</html>
