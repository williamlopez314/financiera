<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitaliza-T Online: El Tablero de tu Vida</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --cell-bg: #ffffff; --p1: #ef4444; --p2: #3b82f6; --p3: #eab308; --p4: #22c55e; --accent: #6366f1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .login-card { background: var(--panel); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
        input { padding: 15px; border-radius: 10px; border: 2px solid #334155; width: 280px; margin-bottom: 15px; background: #0f172a; color: white; text-align: center; font-size: 1rem; }
        #game-container { display: none; gap: 30px; padding: 20px; max-width: 1200px; width: 95%; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        #game-container.active { display: flex; }
        #board { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 8px; width: 600px; height: 600px; background: #334155; padding: 10px; border-radius: 12px; }
        .cell { background: var(--cell-bg); color: #1e293b; border-radius: 8px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; font-size: 0.65rem; font-weight: 900; text-align: center; }
        .center-space { grid-column: 2 / 6; grid-row: 2 / 6; background: rgba(255,255,255,0.03); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; }
        .token-container { display: flex; flex-wrap: wrap; gap: 3px; position: absolute; bottom: 5px; }
        .token { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; }
        #ui-panel { width: 350px; background: var(--panel); padding: 25px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; }
        .player-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border-left: 8px solid transparent; margin-bottom: 5px; }
        .turn-active { background: rgba(99, 102, 241, 0.2); border: 2px solid var(--accent); }
        button { padding: 15px; font-size: 1rem; cursor: pointer; border: none; border-radius: 10px; background: var(--accent); color: white; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px #4338ca; }
        button:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: white; color: #1e293b; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }
        .modal-btn { background: var(--bg); color: white; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; border: none; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h1>🏦 CAPITALIZA-T</h1>
        <input type="text" id="room-input" placeholder="CÓDIGO SALA">
        <input type="text" id="name-input" placeholder="TU NOMBRE">
        <button onclick="joinGame()">ENTRAR A LA SALA</button>
    </div>
</div>

<div id="game-container">
    <div id="board">
        <div class="center-space">
            <h2 id="room-display" style="margin:0; color:var(--accent)">---</h2>
            <div id="dice-anim" style="font-size: 5rem; margin: 10px 0;">🎲</div>
            <h3 id="month-display" style="margin:0">MES 1 / 60</h3>
        </div>
    </div>
    <div id="ui-panel">
        <h2 id="turn-indicator">SALA DE ESPERA</h2>
        <div id="players-list"></div>
        <button id="start-btn" style="display:none; background:#22c55e;" onclick="startGame()">INICIAR PARTIDA 🏁</button>
        <button id="roll-btn" onclick="rollDice()" disabled>LANZAR DADOS 🎲</button>
        <button onclick="toggleReadme(true)" style="background:#475569; font-size:0.8rem; margin-top:10px;">📖 REGLAS</button>
    </div>
</div>

<div id="modal-decision" class="modal-overlay"><div class="modal-content"><h2 id="m-title"></h2><div id="m-desc" style="margin:20px 0;"></div><div id="m-options"></div></div></div>
<div id="modal-readme" class="modal-overlay"><div class="modal-content" style="text-align:left;"><h2>📜 REGLAS</h2><p><strong>Meta:</strong> Mes 60 con mayor Patrimonio.</p><p><strong>Regla 25%:</strong> No pidas deudas si la cuota supera 1/4 de tu saldo.</p><button class="modal-btn" onclick="toggleReadme(false)">VOLVER</button></div></div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCygRQQdJVDMBWICWQmHhaNNC89xu5xviQ",
      authDomain: "financiera-4fb83.firebaseapp.com",
      databaseURL: "https://financiera-4fb83-default-rtdb.firebaseio.com",
      projectId: "financiera-4fb83",
      storageBucket: "financiera-4fb83.firebasestorage.app",
      messagingSenderId: "336849737350",
      appId: "1:336849737350:web:710f4445e0a217b6d42307",
      measurementId: "G-XPJMJQNY94"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let roomCode, myName, myId, isHost = false;

    const CASILLAS = [
        { n: "INICIO", type: "gain", amt: 600000, icon: "🚀" }, { n: "Arriendo", type: "pay", amt: 300000, icon: "🏠" },
        { n: "Banco", type: "bank", icon: "🏦" }, { n: "AFP", type: "afp", icon: "📈" },
        { n: "Comida", type: "pay", amt: 100000, icon: "🛒" }, { n: "Cárcel", type: "event", icon: "🔒" },
        { n: "Bono", type: "gain", amt: 80000, icon: "🎁" }, { n: "Ahorro", type: "save", icon: "💰" },
        { n: "Ocio", type: "pay", amt: 45000, icon: "🍿" }, { n: "SERNAC", type: "event", icon: "🛡️" },
        { n: "Agua/Luz", type: "pay", amt: 60000, icon: "🚰" }, { n: "SUELDO", type: "gain", amt: 600000, icon: "💵" },
        { n: "Avance", type: "bank", icon: "💳" }, { n: "Curso", type: "save", icon: "📚" },
        { n: "Repara PC", type: "pay", amt: 150000, icon: "🔧" }, { n: "Interés AFP", type: "event", icon: "📊" },
        { n: "APV", type: "save", icon: "🌱" }, { n: "Viaje", type: "pay", amt: 300000, icon: "✈️" },
        { n: "Seguro SIS", type: "event", icon: "🏥" }, { n: "Pie Casa", type: "save", icon: "🔑" }
    ];

    function joinGame() {
        roomCode = document.getElementById('room-input').value.toUpperCase().trim();
        myName = document.getElementById('name-input').value.trim();
        if(!roomCode || !myName) return alert("Faltan datos");

        const roomRef = db.ref('rooms/' + roomCode);
        roomRef.once('value', snapshot => {
            let data = snapshot.val() || { started: false, playerOrder: [] };
            let playersMap = data.players || {};
            let existingId = Object.keys(playersMap).find(id => playersMap[id].name === myName);

            if (existingId) {
                myId = existingId;
            } else {
                if (data.started) return alert("Partida en curso.");
                const newP = roomRef.child('players').push();
                myId = newP.key;
                newP.set({ name: myName, pos: 0, money: 600000, afp: 50000, debt: 0, color: ['#ef4444','#3b82f6','#eab308','#22c55e'][Object.keys(playersMap).length] });
                let newOrder = data.playerOrder || [];
                newOrder.push(myId);
                roomRef.update({ playerOrder: newOrder });
            }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-container').classList.add('active');
            document.getElementById('room-display').innerText = "SALA: " + roomCode;
            initBoard();
            startSync();
        });
    }

    function startSync() {
        db.ref('rooms/' + roomCode).on('value', snapshot => {
            const data = snapshot.val();
            if (!data) return;
            // Corregir Host: el primero de la lista es siempre el host
            isHost = (data.playerOrder && data.playerOrder === myId);
            updateUI(data);
            updateTokens(data.players);
        });
    }

    function updateUI(data) {
        const list = document.getElementById('players-list');
        list.innerHTML = "";
        const order = data.playerOrder || [];
        const currentTurnId = order[data.turn];

        order.forEach((id, index) => {
            const p = data.players[id];
            const isTurn = index === data.turn;
            list.innerHTML += `<div class="player-card ${isTurn && data.started ? 'turn-active' : ''}" style="border-left-color:${p.color}">
                <strong>${p.name}</strong> ${isTurn && data.started ? '⭐' : ''}<br>
                Saldo: $${p.money.toLocaleString()} | AFP: $${p.afp.toLocaleString()}</div>`;
        });

        if(!data.started) {
            document.getElementById('turn-indicator').innerText = "SALA DE ESPERA";
            document.getElementById('start-btn').style.display = (isHost && order.length >= 2) ? "block" : "none";
            document.getElementById('roll-btn').disabled = true;
        } else {
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('turn-indicator').innerText = (currentTurnId === myId) ? "¡ES TU TURNO!" : "Turno de otros...";
            document.getElementById('roll-btn').disabled = (currentTurnId !== myId);
        }
        document.getElementById('month-display').innerText = `MES ${data.month || 1} / 60`;
    }

    function startGame() { db.ref('rooms/' + roomCode).update({ started: true, turn: 0, month: 1 }); }

    function rollDice() {
        document.getElementById('roll-btn').disabled = true;
        const dice = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice-anim').innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1];
        const ref = db.ref('rooms/' + roomCode);
        ref.once('value', snap => {
            const d = snap.val();
            const p = d.players[myId];
            let newPos = (p.pos + dice) % 20;
            ref.child('players/' + myId).update({ pos: newPos });
            setTimeout(() => processLanding(CASILLAS[newPos], p, ref, d), 600);
        });
    }

    function processLanding(cell, p, ref, data) {
        if(cell.type === "pay") {
            ref.child('players/' + myId).update({ money: p.money - cell.amt });
            setTimeout(() => next(ref, data), 1000);
        } else if(cell.type === "bank") {
            const cap = Math.max(0, (p.money / 4));
            showDecision("🏦 BANCO", `Crédito: $200k. Cuota: $22k x 12. <br>Capacidad: $${cap.toLocaleString()}`, [
                {t: "Aceptar", a: () => { ref.child('players/' + myId).update({ money: p.money + 200000, debt: p.debt + 264000 }); next(ref, data); }},
                {t: "Rechazar", a: () => next(ref, data)}
            ]);
        } else if(cell.type === "afp") {
            showDecision("📈 AFP", "¿Invertir en Fondo A o E?", [
                {t: "Fondo A", a: () => { ref.child('players/' + myId).update({ afp: p.afp + 15000 }); next(ref, data); }},
                {t: "Fondo E", a: () => { ref.child('players/' + myId).update({ afp: p.afp + 5000 }); next(ref, data); }}
            ]);
        } else { next(ref, data); }
    }

    function next(ref, data) {
        document.getElementById('modal-decision').style.display = 'none';
        let nTotal = data.playerOrder.length;
        let nextIdx = (data.turn + 1) % nTotal;
        let nMonth = (nextIdx === 0) ? (data.month || 1) + 1 : (data.month || 1);
        ref.update({ turn: nextIdx, month: nMonth });
    }

    function showDecision(title, desc, opts) {
        const m = document.getElementById('modal-decision'); m.style.display = 'flex';
        document.getElementById('m-title').innerText = title; document.getElementById('m-desc').innerHTML = desc;
        const area = document.getElementById('m-options'); area.innerHTML = "";
        opts.forEach(o => { const b = document.createElement('button'); b.innerText = o.t; b.className = "modal-btn"; b.onclick = o.a; area.appendChild(b); });
    }

    function initBoard() {
        const board = document.getElementById('board');
        const mapping = ['1/1','1/2','1/3','1/4','1/5','1/6','2/6','3/6','4/6','5/6','6/6','6/5','6/4','6/3','6/2','6/1','5/1','4/1','3/1','2/1'];
        CASILLAS.forEach((c, i) => {
            const div = document.createElement('div'); div.className = 'cell'; div.style.gridArea = mapping[i].replace('/',' / ');
            div.innerHTML = `<span style="font-size:1.1rem">${c.icon}</span><br>${c.n}<div class="token-container" id="slot-${i}"></div>`;
            board.appendChild(div);
        });
    }

    function updateTokens(players) {
        document.querySelectorAll('.token-container').forEach(s => s.innerHTML = "");
        Object.values(players || {}).forEach(p => {
            const slot = document.getElementById(`slot-${p.pos}`);
            if(slot) slot.innerHTML += `<div class="token" style="background:${p.color}"></div>`;
        });
    }

    function toggleReadme(show) { document.getElementById('modal-readme').style.display = show ? 'flex' : 'none'; }
</script>
</body>
</html>
