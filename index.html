<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Capitaliza-T: El Tablero Financiero</title>
    <style>
        :root { --board-bg: #ecf0f1; --player1: #e74c3c; --player2: #3498db; --player3: #f1c40f; --player4: #27ae60; }
        body { font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; margin: 0; }
        
        #game-wrapper { display: flex; padding: 20px; gap: 20px; }
        
        /* Tablero Cuadrado */
        #board { display: grid; grid-template-columns: repeat(6, 80px); grid-template-rows: repeat(6, 80px); gap: 4px; background: #bdc3c7; pading: 5px; border: 5px solid #7f8c8d; }
        .cell { background: white; color: #333; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 4px; position: relative; font-weight: bold;}
        .corner { background: #95a5a6; }
        
        /* Jugadores */
        .token { width: 15px; height: 15px; border-radius: 50%; position: absolute; border: 2px solid white; transition: all 0.3s; }
        #t0 { background: var(--player1); top: 5px; left: 5px; }
        #t1 { background: var(--player2); top: 5px; right: 5px; }
        #t2 { background: var(--player3); bottom: 5px; left: 5px; }
        #t3 { background: var(--player4); bottom: 5px; right: 5px; }

        /* UI */
        #ui { width: 300px; background: #34495e; padding: 20px; border-radius: 10px; }
        .stat-box { margin-bottom: 10px; padding: 10px; border-left: 5px solid; }
        button { width: 100%; padding: 15px; font-size: 18px; cursor: pointer; background: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold; }
        
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #333; padding: 30px; border-radius: 15px; z-index: 100; width: 350px; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<h1>🏦 CAPITALIZA-T: 4to MEDIO</h1>
<div id="game-wrapper">
    <div id="board">
        <!-- Generado por JS -->
    </div>

    <div id="ui">
        <h2 id="turn-label">Turno: Jugador 1</h2>
        <div id="player-stats"></div>
        <button onclick="rollDice()">🎲 LANZAR DADOS</button>
        <p>Tiempo restante: <span id="timer">30:00</span></p>
    </div>
</div>

<div id="modal">
    <h2 id="m-title"></h2>
    <p id="m-desc"></p>
    <div id="m-options"></div>
</div>

<script>
    const cells = [
        { n: "INICIO", type: "start" }, { n: "Gasto Común", type: "pay", amt: 50000 }, { n: "AFP: Elige Fondo", type: "afp" }, { n: "Crédito Consumo", type: "bank" }, { n: "Supermercado", type: "pay", amt: 80000 }, { n: "Cárcel Deuda", type: "corner" },
        { n: "Bono Estatal", type: "gain", amt: 100000 }, { n: "Pie Depto", type: "invest", cost: 500000 }, { n: "SERNAC: Reclamo", type: "event" }, { n: "Salida Cine", type: "pay", amt: 30000 }, { n: "Interés APV", type: "gain", amt: 50000 }, { n: "Urgencia Médica", type: "pay", amt: 150000 },
        { n: "Invierte: Curso", type: "invest", cost: 200000 }, { n: "AFP: Mercado Caído", type: "event" }, { n: "Banco: Avance", type: "bank" }, { n: "Compra Ropa", type: "pay", amt: 60000 }, { n: "Día de Pago", type: "gain", amt: 450000 }, { n: "Vacaciones", type: "pay", amt: 200000 },
        { n: "Seguro SIS", type: "event" }, { n: "Pie Auto", type: "invest", cost: 300000 }
    ];

    let players = [
        { id: 1, pos: 0, money: 500000, afp: 0, debt: 0 },
        { id: 2, pos: 0, money: 500000, afp: 0, debt: 0 },
        { id: 3, pos: 0, money: 500000, afp: 0, debt: 0 },
        { id: 4, pos: 0, money: 500000, afp: 0, debt: 0 }
    ];
    let turn = 0;

    function initBoard() {
        const b = document.getElementById('board');
        // Crear 20 casillas en anillo (simplificado)
        for(let i=0; i<20; i++) {
            let div = document.createElement('div');
            div.className = "cell";
            div.id = "cell-" + i;
            div.innerHTML = `<span>${cells[i].n}</span>`;
            if(i==0) div.innerHTML += `<div class="token" id="t0"></div><div class="token" id="t1"></div><div class="token" id="t2"></div><div class="token" id="t3"></div>`;
            b.appendChild(div);
        }
        updateUI();
    }

    function rollDice() {
        let roll = Math.floor(Math.random() * 6) + 1;
        let p = players[turn];
        p.pos = (p.pos + roll) % 20;
        
        // Mover token
        document.querySelectorAll('.token')[turn].parentElement.removeChild(document.querySelectorAll('.token')[turn]);
        let token = document.createElement('div');
        token.className = "token";
        token.id = "t" + turn;
        document.getElementById('cell-' + p.pos).appendChild(token);

        handleLand(p, cells[p.pos]);
    }

    function handleLand(p, cell) {
        if(cell.type === "pay") {
            p.money -= cell.amt;
            alert(`Jugador ${p.id} pagó ${cell.n}: -$${cell.amt}`);
            nextTurn();
        } else if (cell.type === "bank") {
            showModal("BANCO", `¿Deseas un crédito de $200.000? CAE: 25%. Cuota: $25.000 x 10 meses.`, [
                {t: "Aceptar (Carga Financiera)", a: () => { p.money += 200000; p.debt += 250000; nextTurn(); }},
                {t: "Rechazar", a: () => nextTurn()}
            ]);
        } else {
            nextTurn();
        }
    }

    function nextTurn() {
        document.getElementById('modal').style.display = 'none';
        turn = (turn + 1) % 4;
        updateUI();
    }

    function updateUI() {
        document.getElementById('turn-label').innerText = "Turno: Jugador " + (turn + 1);
        let html = "";
        players.forEach(p => {
            html += `<div class="stat-box" style="border-color:var(--player${p.id})">
                <b>J${p.id}</b> | Saldo: $${p.money.toLocaleString()} | Deuda: $${p.debt.toLocaleString()}
            </div>`;
        });
        document.getElementById('player-stats').innerHTML = html;
    }

    function showModal(title, desc, opts) {
        const m = document.getElementById('modal');
        m.style.display = 'block';
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        const optDiv = document.getElementById('m-options');
        optDiv.innerHTML = "";
        opts.forEach(o => {
            let btn = document.createElement('button');
            btn.innerText = o.t;
            btn.onclick = o.a;
            btn.style.margin = "5px 0";
            optDiv.appendChild(btn);
        });
    }

    initBoard();
</script>
</body>
</html>
